<!DOCTYPE html>
<html>
  <head>
    <style>
    body {
      font-size: 25px;
      background-color: #606c38;
      color: #fefae0;
      width: 1500px;
      margin: auto;
    }

    h1 {
      text-decoration: underline;
      text-decoration-color: #bc6c25;
    }

    h2 {
      text-decoration: underline;
      text-decoration-color: #bc6c25;
    }

    ul {
      list-style-type: none;
    }

    ul li::marker{
      content: "-- ";
      color: #bc6c25;
      font-style: bold;
    }

    #content{
      background-color: #283618;
      padding: 20px;
      margin: 10px;
      border-radius: 15px;
      box-shadow: 2px 4px 8px black;
    }
    </style>
  </head>
  <body>
    <div id="content">
      CONTENT
    </div>
  </body>
</html
