name: page

on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: build
        run: 
          cargo run;

      - name: upload
        uses: actions/upload-artifact@v4
        with: 
          name: page-output
          path: output/

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: deploy
        run: |
          mkdir public;
          cp -r output/* public;
          cp 0256.jpg public;
          echo "public:";
          ls public;
      - name: save
        uses: actions/upload-artifact@v4
        with: 
          name: page
          path: public/
