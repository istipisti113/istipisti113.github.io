image: rust:latest

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - cargo run

pages:
  stage: deploy
  script:
    - cat public/index.html
    - echo teszt > public/index.html
  artifacts:
    paths:
      - public
    # The folder that contains the files to be exposed at the Page URL
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
