image: rust:latest

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - cargo run
  artifacts:
    paths:
      - output

pages:
  stage: deploy
  script:
    - mkdir public
    - cp -r output/* public
    - cp 0256.jpg public
    - echo "public:"
    - ls public
  artifacts:
    paths:
      - public
    # The folder that contains the files to be exposed at the Page URL
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
